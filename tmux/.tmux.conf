# =============================================================================
# tmux config — Jeff's dotfiles
# =============================================================================

# ---------------------------------------------------------------------------
# Général
# ---------------------------------------------------------------------------
set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g mouse on
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# ---------------------------------------------------------------------------
# Prefix : Ctrl-a
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Reload config
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config rechargée"

# ---------------------------------------------------------------------------
# Splits & fenêtres
# ---------------------------------------------------------------------------
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Navigation panes (Vim style)
# ---------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Popups persistants
# ---------------------------------------------------------------------------

# Claude Code — session persistante par répertoire
bind -r y run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | gmd5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w85% -h85% -E "tmux attach-session -t $SESSION"'

# LazyGit
bind g display-popup -w85% -h85% -E -d "#{pane_current_path}" "lazygit"

# LazyDocker
bind d display-popup -w85% -h85% -E "lazydocker"

# Neovim rapide
bind e display-popup -w85% -h85% -E -d "#{pane_current_path}" "nvim"

# bottom (monitoring)
bind b display-popup -w85% -h85% -E "btm"

# ---------------------------------------------------------------------------
# Copy mode (vi)
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Status bar — Tokyo Night
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=#565f89"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M "
set -g status-right-length 20
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=default,fg=#7aa2f7"

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---------------------------------------------------------------------------
# Auto-install TPM si absent
# ---------------------------------------------------------------------------
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialiser TPM (TOUJOURS en dernière ligne)
run '~/.tmux/plugins/tpm/tpm'
