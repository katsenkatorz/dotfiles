onboarding = false

[keys]
# Open an existing git worktree as a workspace (unbound by default upstream).
# Claude Code worktrees (.claude/worktrees/*) show up in this picker too.
open_worktree = "prefix+shift+o"

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[theme]
# "terminal" adopts the host terminal palette (Ghostty night-owl theme)
name = "terminal"
auto_switch = false

[theme.custom]
# Cyan accent matching the JankyBorders active border, night-owl surface
# stack: panels slightly lighter than the Ghostty background, readable
# muted text
accent = "#24EAF7"
panel_bg = "#041B30"
surface0 = "#0D2E4A"
surface1 = "#164263"
surface_dim = "#051C2F"
text = "#CBE0F0"
subtext0 = "#7FA6C4"
