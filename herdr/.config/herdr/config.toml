onboarding = false

[keys]
# Open an existing git worktree as a workspace (unbound by default upstream).
# Claude Code worktrees (.claude/worktrees/*) show up in this picker too.
open_worktree = "prefix+shift+o"

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[theme]
# "terminal" adopts the host terminal palette (Ghostty night-owl theme)
name = "terminal"
auto_switch = false

[theme.custom]
# Let the Ghostty background show through, cyan accent matching the
# JankyBorders active border
panel_bg = "reset"
accent = "#24EAF7"
