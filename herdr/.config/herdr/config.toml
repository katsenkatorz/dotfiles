onboarding = false

[keys]
# Open an existing git worktree as a workspace (unbound by default upstream).
# Claude Code worktrees (.claude/worktrees/*) show up in this picker too.
open_worktree = "prefix+shift+o"

# Navigation entre agents (toute la famille est unbound par defaut upstream).
# Sans elles, le panneau d'agents s'affiche mais rien n'y saute au clavier.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin"
auto_switch = false

[session]
# A resumed pane duplicates any session the `claude agents` daemon already runs
# in the background (second process, then a "(2)" job). Reattach with `aga <id>`.
resume_agents_on_restore = false
